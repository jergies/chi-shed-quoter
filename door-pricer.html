<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHI Overhead Door Pricer</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; }
        .header { background:#0066cc; color:white; padding:20px; text-align:center; font-size:1.4em; font-weight:bold; }
        .content { padding:20px; max-width:560px; margin:auto; background:white; box-shadow:0 0 15px rgba(0,0,0,0.1); }
        label { display:block; margin:12px 0 6px; font-weight:bold; }
        input, select, button { width:100%; padding:14px; margin:8px 0; border:1px solid #ccc; border-radius:8px; font-size:1.05em; box-sizing:border-box; }
        button { background:#0066cc; color:white; border:none; font-weight:bold; }
        .settings-btn { background:#f39c12; color:white; padding:18px; margin:10px 0 20px 0; font-size:1.3em; font-weight:bold; border:none; border-radius:10px; }
        .close-btn { background:#e74c3c; color:white; padding:18px; font-size:1.3em; font-weight:bold; margin-bottom:20px; }
        .quote { background:#e6f7e6; padding:20px; border-radius:10px; margin-top:20px; line-height:1.6; }
        .row { display:flex; gap:10px; }
        .row > div { flex:1; }
    </style>
</head>
<body>
    <div class="header">CHI Overhead Door Pricer</div>
    <div class="content">
        <button onclick="requestPassword()" class="settings-btn">⚙️ PRICE SETTINGS</button>

        <div id="settings" style="display:none; background:#f9f9f9; padding:20px; border-radius:8px; margin-bottom:15px;">
            <button onclick="closeSettings()" class="close-btn">✕ CLOSE SETTINGS</button>
            <label>CHI price per sq ft</label>
            <input type="number" id="chiPerSqft" value="18" step="0.25">
            <label>Markup % (Corny uses 30)</label>
            <input type="number" id="markupPct" value="30" step="1">
            <label>Labor $ per sq ft (Corny uses 5)</label>
            <input type="number" id="laborPerSqft" value="5" step="0.25">
            <label>LiftMaster electric operator (each)</label>
            <input type="number" id="electricPrice" value="850">
            <label>Window each</label>
            <input type="number" id="winPrice" value="280">
            <label>Insulation add-on $ per inch per sq ft</label>
            <input type="number" id="insPrice" value="1.50" step="0.05">
        </div>

        <div class="row">
            <div>
                <label>Door Width (ft)</label>
                <input type="number" id="doorW" value="10" min="6" max="20" onchange="calculate()">
            </div>
            <div>
                <label>Door Height (ft)</label>
                <input type="number" id="doorH" value="8" min="6" max="16" onchange="calculate()">
            </div>
        </div>

        <label>Common size</label>
        <select id="sizePreset" onchange="applyPreset()">
            <option value="">Custom</option>
            <option value="8x7">8' × 7'</option>
            <option value="9x7">9' × 7'</option>
            <option value="9x8">9' × 8'</option>
            <option value="10x8" selected>10' × 8'</option>
            <option value="10x10">10' × 10'</option>
            <option value="12x10">12' × 10'</option>
            <option value="12x12">12' × 12'</option>
            <option value="14x12">14' × 12'</option>
            <option value="14x14">14' × 14'</option>
            <option value="16x14">16' × 14'</option>
        </select>

        <label>Operator</label>
        <select id="operator" onchange="calculate()">
            <option value="chain" selected>Chain hoist (included with CHI)</option>
            <option value="electric">Electric — LiftMaster (add-on)</option>
        </select>

        <label>Door Style</label>
        <select id="style" onchange="calculate()">
            <option value="smooth">Smooth</option>
            <option value="textured" selected>Textured</option>
            <option value="micro">Micro-Grooved</option>
        </select>

        <label>Insulation Thickness</label>
        <select id="insulation" onchange="calculate()">
            <option value="0">No Insulation</option>
            <option value="1.5">1.5"</option>
            <option value="2" selected>2"</option>
            <option value="3">3"</option>
        </select>

        <label>Sandwich Panel</label>
        <select id="sandwich" onchange="calculate()">
            <option value="0">No</option>
            <option value="1" selected>Yes - Steel</option>
            <option value="1.2">Yes - Vinyl</option>
        </select>

        <label>Number of Windows</label>
        <input type="number" id="windows" value="0" min="0" max="8" onchange="calculate()">

        <label>Track Type</label>
        <select id="track" onchange="calculate()">
            <option value="1">Standard Overhead</option>
            <option value="1.15">High Lift / Rake</option>
            <option value="1.25">Vertical / Straight Up</option>
        </select>

        <label>Framing</label>
        <select id="framing" onchange="calculate()">
            <option value="1">Steel</option>
            <option value="0.85">Wood</option>
        </select>

        <button onclick="calculate()" style="margin:25px 0; padding:18px; font-size:1.2em;">Calculate Door Price</button>
        <div class="quote" id="quoteDisplay">Select size and options</div>
    </div>

    <script>
        const correctPassword = "chi2026";

        function requestPassword() {
            const entered = prompt("Enter Password to access Price Settings:");
            if (entered === correctPassword) {
                document.getElementById('settings').style.display = 'block';
            } else {
                alert("Incorrect password.");
            }
        }

        function closeSettings() {
            document.getElementById('settings').style.display = 'none';
        }

        function applyPreset() {
            const p = document.getElementById('sizePreset').value;
            if (!p) return;
            const parts = p.split('x');
            document.getElementById('doorW').value = parts[0];
            document.getElementById('doorH').value = parts[1];
            calculate();
        }

        function calculate() {
            const w = parseFloat(document.getElementById('doorW').value) || 10;
            const h = parseFloat(document.getElementById('doorH').value) || 8;
            const sqft = w * h;

            const chiPerSqft = parseFloat(document.getElementById('chiPerSqft').value) || 18;
            const markupPct = parseFloat(document.getElementById('markupPct').value) || 30;
            const laborPerSqft = parseFloat(document.getElementById('laborPerSqft').value) || 5;
            const electricPrice = parseFloat(document.getElementById('electricPrice').value) || 850;
            const winPrice = parseFloat(document.getElementById('winPrice').value) || 280;
            const insPrice = parseFloat(document.getElementById('insPrice').value) || 1.5;

            const operator = document.getElementById('operator').value;
            const styleFactor = document.getElementById('style').value === 'micro' ? 1.1 : 1;
            const insLevel = parseFloat(document.getElementById('insulation').value) || 0;
            const sandwichFactor = parseFloat(document.getElementById('sandwich').value) || 0;
            const windows = parseInt(document.getElementById('windows').value) || 0;
            const trackFactor = parseFloat(document.getElementById('track').value) || 1;
            const framingFactor = parseFloat(document.getElementById('framing').value) || 1;

            let chiDoor = sqft * chiPerSqft * styleFactor;
            chiDoor += sqft * insLevel * insPrice * sandwichFactor;
            chiDoor += windows * winPrice;
            chiDoor = chiDoor * trackFactor * framingFactor;

            const markup = chiDoor * (markupPct / 100);
            const labor = sqft * laborPerSqft;
            const operatorCost = (operator === 'electric') ? electricPrice : 0;
            const total = chiDoor + markup + labor + operatorCost;

            const opLabel = operator === 'electric'
                ? 'Electric LiftMaster: $' + Math.round(operatorCost).toLocaleString()
                : 'Chain hoist: included in CHI';

            document.getElementById('quoteDisplay').innerHTML = `
                <strong>${w}' × ${h}' Overhead Door</strong> • ${sqft} sq ft<br><br>
                CHI door (with options): $${Math.round(chiDoor).toLocaleString()}<br>
                Markup ${markupPct}%: $${Math.round(markup).toLocaleString()}<br>
                Install labor ($${laborPerSqft}/sq ft): $${Math.round(labor).toLocaleString()}<br>
                ${opLabel}<br>
                <hr>
                <strong style="color:#0066cc; font-size:1.5em;">Sell Price: $${Math.round(total).toLocaleString()}</strong>
            `;
        }

        window.onload = calculate;
    </script>
</body>
</html>
